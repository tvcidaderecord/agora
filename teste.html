<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Portal de Apps | Grupo Agora</title>
<style>
  :root {
    --red:#b01d23; --red-dark:#7d1519; --ink:#151418; --text:#1d1b22; --muted:#6f6b78;
    --line:rgba(21,20,24,.09); --glass:rgba(255,255,255,.72); --bg:#faf8f9;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; }
  html { color-scheme:light; }
  body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); position:relative; overflow-x:hidden; }

  /* fundo animado */
  .bg { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; animation:float 18s ease-in-out infinite; }
  .b1 { width:420px; height:420px; background:#e8545a; top:-120px; right:-100px; }
  .b2 { width:380px; height:380px; background:#b6b2bd; bottom:-140px; left:-120px; animation-delay:-6s; opacity:.45; }
  .b3 { width:260px; height:260px; background:#f3a4a7; top:45%; left:55%; animation-delay:-11s; opacity:.35; }
  @keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    33% { transform:translate(40px,-30px) scale(1.08); }
    66% { transform:translate(-30px,30px) scale(.95); }
  }

  .wrap { max-width:880px; margin:0 auto; padding:20px 18px 56px; }
  .hero { text-align:center; padding:6px 0 26px; }
  .logo-btn { display:block; margin:0 auto 14px; padding:0; border:0; background:none; cursor:default;
              border-radius:16px; -webkit-tap-highlight-color:transparent; }
  .logo-btn:focus-visible { outline:3px solid rgba(176,29,35,.4); outline-offset:6px; }
  .logo { width:168px; max-width:48vw; height:auto; display:block; margin:0;
          animation:pop .9s var(--ease) both, bob 6s ease-in-out 1s infinite; filter:drop-shadow(0 10px 18px rgba(176,29,35,.15)); }
  @keyframes pop { from { opacity:0; transform:scale(.8) translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  h1 { margin:0; font-size:clamp(1.7rem,5vw,2.4rem); letter-spacing:-.02em; animation:up .7s var(--ease) .15s both;
       background:linear-gradient(90deg,var(--ink),var(--red)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin:8px 0 0; color:var(--muted); animation:up .7s var(--ease) .25s both; }
  @keyframes up { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

  .tools { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 16px;
           flex-wrap:wrap; animation:up .7s var(--ease) .35s both; }
  .search { position:relative; flex:1 1 260px; }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); }
  .search input { padding-left:42px; border-radius:999px; background:var(--glass); backdrop-filter:blur(10px); }
  #count { color:var(--muted); font-size:.85rem; }

  .list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  @media (max-width:640px) { .list { grid-template-columns:1fr; } }

  .app { position:relative; display:flex; align-items:center; gap:14px; padding:16px; border-radius:18px;
         background:var(--glass); backdrop-filter:blur(12px); border:1px solid var(--line);
         box-shadow:0 1px 2px rgba(21,20,24,.04); transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
         animation:up .6s var(--ease) both; animation-delay:calc(var(--i,0) * 70ms + 400ms); }
  .app:hover { transform:translateY(-5px); border-color:rgba(176,29,35,.3); box-shadow:0 18px 34px -14px rgba(176,29,35,.35); }
  .av { flex:none; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff;
        font-weight:700; font-size:1.2rem; background:linear-gradient(135deg,var(--red),var(--red-dark));
        transition:transform .3s var(--ease); }
  .app:nth-child(even) .av { background:linear-gradient(135deg,#2b2a31,var(--ink)); }
  .app:hover .av { transform:rotate(-6deg) scale(1.06); }
  .info { flex:1; min-width:0; }
  .name { font-weight:650; overflow-wrap:anywhere; line-height:1.25; }
  .hint { color:var(--muted); font-size:.8rem; margin-top:2px; }

  .go { flex:none; display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-weight:600; font-size:.9rem;
        color:#fff; background:linear-gradient(135deg,var(--red),var(--red-dark)); padding:10px 16px; border-radius:12px;
        position:relative; overflow:hidden; transition:filter .2s, box-shadow .2s; }
  .go::after { content:""; position:absolute; inset:0; } /* card inteiro clicável */
  .go::before { content:""; position:absolute; top:0; left:-120%; width:60%; height:100%;
                background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg);
                transition:left .6s var(--ease); }
  .app:hover .go::before { left:140%; }
  .app:hover .go { box-shadow:0 8px 18px -6px rgba(176,29,35,.6); }
  .go svg { width:16px; height:16px; transition:transform .25s var(--ease); }
  .app:hover .go svg { transform:translateX(4px); }
  .go:focus-visible { outline:3px solid rgba(176,29,35,.4); outline-offset:3px; }

  /* carregando */
  .sk { height:82px; border-radius:18px; background:linear-gradient(100deg,#ece9ee 30%,#f7f5f8 50%,#ece9ee 70%);
        background-size:200% 100%; animation:shimmer 1.3s linear infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0; animation:up .5s var(--ease) both; }
  #msg { color:#d62828; text-align:center; padding:10px 0; }

  footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:40px; }

  /* formulários e diálogo */
  button, input { font:inherit; }
  input { width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--text);
          transition:border-color .2s, box-shadow .2s; }
  input:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 4px rgba(176,29,35,.12); }
  .btn { cursor:pointer; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--text); padding:10px 16px;
         transition:transform .2s var(--ease), box-shadow .2s; }
  .btn:hover { transform:translateY(-1px); }
  .btn.primary { background:linear-gradient(135deg,var(--red),var(--red-dark)); border-color:transparent; color:#fff; }
  .btn.danger { color:var(--red); }
  button:focus-visible { outline:3px solid rgba(176,29,35,.4); outline-offset:2px; }
  dialog { border:0; border-radius:22px; padding:0; width:min(480px,94vw); background:#fff; color:var(--text);
           box-shadow:0 30px 80px -20px rgba(0,0,0,.45); }
  dialog[open] { animation:dlg .35s var(--ease); }
  dialog::backdrop { background:rgba(21,20,24,.5); backdrop-filter:blur(6px); }
  @keyframes dlg { from { opacity:0; transform:translateY(20px) scale(.96); } to { opacity:1; transform:none; } }
  .m { padding:22px; display:grid; gap:14px; }
  .m h2 { margin:0; font-size:1.2rem; }
  label { display:grid; gap:5px; font-size:.85rem; color:var(--muted); }
  .actions { display:flex; justify-content:flex-end; gap:8px; }
  .err-txt { color:#d62828; font-size:.85rem; min-height:1.1em; }
  .adm-list { display:grid; gap:8px; max-height:220px; overflow:auto; }
  .adm-item { display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--line);
              border-radius:12px; padding:8px 10px; font-size:.9rem; }
  .adm-item span { overflow-wrap:anywhere; }
  .adm-item .btn { padding:5px 10px; font-size:.8rem; }
  .form-title { font-weight:600; }
  [hidden] { display:none !important; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>

    <h1>Nossos apps</h1>
    <p class="sub">Escolha o app e toque em Acessar.</p>
  </header>

  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar app…" aria-label="Buscar app" autocomplete="off">
    </div>
    <span id="count"></span>
  </div>

  <div id="msg" hidden></div>
  <div class="list" id="list">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>

  <footer>Grupo Agora de Comunicação</footer>
</div>

<dialog id="dlg">
  <div class="m">
    <div id="login" class="m" style="padding:0">
      <h2>Área do administrador</h2>
      <label>Senha <input id="pass" type="password" autocomplete="current-password"></label>
      <div class="err-txt" id="loginErr" role="alert"></div>
      <div class="actions">
        <button class="btn" id="cancel">Cancelar</button>
        <button class="btn primary" id="enter">Entrar</button>
      </div>
    </div>

    <div id="panel" class="m" style="padding:0" hidden>
      <h2>Cadastrar novo app</h2>
      <label>Nome do app <input id="nome" maxlength="60" autocomplete="off" placeholder="Ex.: Calendário BLITZ"></label>
      <label>Link de acesso <input id="link" type="url" autocomplete="off" placeholder="https://usuario.github.io/meu-app/"></label>
      <div class="err-txt" id="panelErr" role="alert"></div>
      <div class="actions"><button class="btn primary" id="add">Cadastrar app</button></div>
      <div class="form-title">Apps cadastrados</div>
      <div class="adm-list" id="admList"></div>
      <div class="actions"><button class="btn" id="logout">Sair</button></div>
    </div>
  </div>
</dialog>

<script>
// ====== CONFIGURAÇÃO ======
const API_URL = 'https://script.google.com/macros/s/AKfycbx6BBdW90GP2rOEjjGG2NRBhJEpQ-mx1tQdfaWJAv-2LnhfOE7X_hUpf7KpNAYJvfrx/exec';
// A senha NÃO fica aqui: ela é conferida no Apps Script.
// ==========================

const $ = id => document.getElementById(id);
let apps = [];
let senha = null; // guardada só na memória da aba

async function load() {
  try {
    const r = await fetch(API_URL);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    apps = j.items.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    $('msg').hidden = true;
  } catch (e) {
    $('msg').textContent = 'Não foi possível carregar os apps: ' + e.message;
    $('msg').hidden = false;
  }
  render();
}

async function send(payload) {
  // text/plain evita o preflight de CORS no Apps Script
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ password: senha, ...payload }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
}

function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#'; }

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function render() {
  const q = $('q').value.trim().toLowerCase();
  const shown = apps.filter(a => a.nome.toLowerCase().includes(q));
  const list = $('list'); list.innerHTML = '';

  $('count').textContent = apps.length
    ? `${shown.length} ${shown.length === 1 ? 'app' : 'apps'}${q ? ' encontrados' : ' disponíveis'}` : '';

  if (!shown.length && $('msg').hidden) {
    const d = document.createElement('div'); d.className = 'empty';
    d.textContent = apps.length ? 'Nenhum app encontrado para essa busca.' : 'Nenhum app cadastrado ainda.';
    list.appendChild(d);
  }
  shown.forEach((a, idx) => {
    const row = document.createElement('div'); row.className = 'app'; row.style.setProperty('--i', idx);
    const av = document.createElement('div'); av.className = 'av'; av.textContent = a.nome.charAt(0).toUpperCase();
    const info = document.createElement('div'); info.className = 'info';
    const n = document.createElement('div'); n.className = 'name'; n.textContent = a.nome;
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Abre em nova aba';
    info.append(n, h);
    const b = document.createElement('a'); b.className = 'go';
    b.href = safeUrl(a.link); b.target = '_blank'; b.rel = 'noopener noreferrer';
    b.setAttribute('aria-label', `Acessar ${a.nome}`);
    b.innerHTML = 'Acessar ' + ARROW;
    row.append(av, info, b); list.appendChild(row);
  });
  renderAdmin();
}

function renderAdmin() {
  const box = $('admList'); box.innerHTML = '';
  apps.forEach(a => {
    const row = document.createElement('div'); row.className = 'adm-item';
    const n = document.createElement('span'); n.textContent = a.nome;
    const d = document.createElement('button'); d.className = 'btn danger'; d.textContent = 'Excluir';
    d.onclick = async () => {
      if (!confirm(`Excluir "${a.nome}" do portal?`)) return;
      $('panelErr').textContent = '';
      try { await send({ action: 'delete', id: a.id }); await load(); }
      catch (e) { $('panelErr').textContent = e.message; }
    };
    row.append(n, d); box.appendChild(row);
  });
}

function showLogin() {
  senha = null;
  $('login').hidden = false; $('panel').hidden = true;
  $('pass').value = ''; $('loginErr').textContent = '';
}

$('q').addEventListener('input', render);
$('admBtn').onclick = () => { showLogin(); $('dlg').showModal(); $('pass').focus(); };
$('cancel').onclick = () => $('dlg').close();
$('logout').onclick = () => { showLogin(); $('dlg').close(); };
$('dlg').addEventListener('close', () => { senha = null; });

async function entrar() {
  senha = $('pass').value;
  $('loginErr').textContent = 'Verificando…';
  try {
    await send({ action: 'login' });
    $('loginErr').textContent = '';
    $('login').hidden = true; $('panel').hidden = false;
    $('nome').focus();
  } catch (e) { senha = null; $('loginErr').textContent = e.message; }
}
$('enter').onclick = entrar;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

$('add').onclick = async () => {
  $('panelErr').textContent = 'Salvando…';
  try {
    await send({ action: 'add', nome: $('nome').value, link: $('link').value });
    $('nome').value = ''; $('link').value = ''; $('panelErr').textContent = '';
    await load();
  } catch (e) { $('panelErr').textContent = e.message; }
};

load();
</script>
</body>
</html>
